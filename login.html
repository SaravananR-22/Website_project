<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR.HOME BAKER</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playwrite+AU+SA:wght@100..400&display=swap" rel="stylesheet">
</head>
<body>
    <style>
        *{
    padding: 0px;
    margin: 0px;
    box-sizing: border-box;
    

    font-family: "Playwrite AU SA", cursive;
    font-optical-sizing: auto;
    font-weight: weight;
    font-style: normal;
  
    

}
.content a{
    text-decoration: none;
}

.head a{
    text-decoration: none;
    color: black;
    font-size: 20;
}
.head header a{
    color: black;
    font-size: 30px;
}

img{
    background-size: cover;
    background-position:center ;
    height: 70vh;
    width: 100%;
}
body{
    background-image: url("ss.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    width: 100%;
    height: 100vh;
}

.head{
    display: flex;
    
}
header{
    flex: 3;
    font-size: 30px;
    display: flex;
    padding: 20px;
    font-weight: bolder;
}
nav{
    display: flex;
    flex: 2;
    padding: 20px;
    padding: 20px;
    font-size: 20px;
    font-weight: bolder;
}
nav a{
    flex:2;
}

    

nav a:hover{
    color:white ;
    
}

footer {
    background-color: #333;
    width: 100%;
    color: white;
    text-align: center;
    
    position: absolute;
    bottom: 0;
    

}
/* Tablet devices (768px and below) */
@media (max-width: 768px) {
    header, nav {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .head {
        flex-direction: column;
        align-items: center;
    }

    nav a {
        margin: 10px 0;
        font-size: 18px;
    }

    .content {
        font-size: 24px;
        padding: 20px;
    }

    .s {
        width: 60%;
        margin: 10px auto;
    }

    .button {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
}

/* Mobile devices (480px and below) */
@media (max-width: 480px) {
    header {
        font-size: 24px;
    }

    .head header a {
        font-size: 24px;
    }

    nav {
        font-size: 16px;
    }

    .content {
        font-size: 20px;
    }

    h2, h5, h6 {
        font-size: 18px;
    }

    .s {
        font-size: 16px;
        padding: 8px;
        width: 80%;
    }

    footer {
        font-size: 14px;
        padding: 10px;
    }
}


    </style>

    <div class="head" id="landing">
        
        <header>
            <a href="">👨🏻‍🍳 MR.HOMEBAKER </a>
        </header>
        <nav>
            <a href="http://">MENU</a>
            <a href="http://">LOG IN</a>
        </nav>
        <div class="login-container">
            <h2>Login</h2>
            <form action="#" method="POST">
              <div class="input-group">
                <input type="text" placeholder="Username" required />
              </div>
              <div class="input-group">
                <input type="password" placeholder="Password" required />
              </div>
              <button type="submit">Login</button>
              <p class="signup-link">Don't have an account? <a href="#">Sign up</a></p>
            </form>
          </div>
       
        </body>
        </html>
        
        
    
    
    
    
    <footer>

        </p></footer>
    
</body>
</html>
